<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پلتفرم پخش و دانلود سریال‌ها - استایل گرگی</title>
  
  <!-- فونت فارسی وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --bg-dark: #090b0e;
      --card-bg: rgba(18, 22, 28, 0.85);
      --wolf-silver: #d1d5db;
      --crimson-red: #dc2626;
      --crimson-glow: rgba(220, 38, 38, 0.35);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 15px;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(75, 85, 99, 0.08) 0%, transparent 50%);
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wolf-brand {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 0 20px var(--crimson-glow);
    }

    .wolf-svg {
      width: 36px;
      height: 36px;
      fill: var(--wolf-silver);
    }

    .title {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff, var(--wolf-silver), var(--crimson-red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--wolf-silver);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      width: fit-content;
      margin-bottom: 5px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--crimson-red);
      color: #fff;
    }

    .series-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .series-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease;
    }

    .series-card:hover {
      transform: translateY(-5px);
      border-color: rgba(220, 38, 38, 0.6);
    }

    .series-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #1f2937;
    }

    .series-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .series-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .series-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .badge-count {
      background: rgba(220, 38, 38, 0.2);
      color: var(--crimson-red);
      border: 1px solid rgba(220, 38, 38, 0.3);
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .series-meta {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .episodes-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .episode-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .episode-top {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .episode-img {
      width: 90px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background-color: #1f2937;
    }

    .episode-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .episode-number {
      font-size: 0.75rem;
      color: var(--crimson-red);
      font-weight: 700;
    }

    .episode-name {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .episode-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-download {
      background: rgba(255, 255, 255, 0.06);
      color: var(--wolf-silver);
      border: 1px solid var(--glass-border);
    }

    .btn-download:hover {
      background: var(--wolf-silver);
      color: #000;
    }

    .btn-play {
      background: var(--crimson-red);
      color: #fff;
      box-shadow: 0 4px 12px var(--crimson-glow);
    }

    .btn-play:hover {
      opacity: 0.9;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 1000;
      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #12161c;
      border: 1px solid var(--glass-border);
      border-radius: 20px 20px 20px 20px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .close-modal {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .quality-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .quality-option:hover {
      border-color: var(--crimson-red);
      background: rgba(220, 38, 38, 0.1);
    }

    .quality-info {
      display: flex;
      flex-direction: column;
    }

    .q-title {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .q-size {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">

    <header class="header">
      <div class="wolf-brand">
        <svg class="wolf-svg" viewBox="0 0 24 24">
          <path d="M12 2L4 9l2 9 6 3 6-3 2-9-8-7zm0 3.8l4.8 4.2-1.2 5.4-3.6 1.8-3.6-1.8-1.2-5.4L12 5.8z"/>
        </svg>
      </div>
      <h1 class="title" id="page-title">آرشیو سریال‌ها</h1>
      <p class="subtitle">پخش و دانلود اختصاصی با استایل سینمایی</p>
    </header>

    <button class="back-btn" id="back-btn" onclick="showSeriesList()">
      ← بازگشت به لیست سریال‌ها
    </button>

    <main class="series-grid" id="series-view">
      <div class="loading-text">در حال بارگذاری سریال‌ها...</div>
    </main>

    <main class="episodes-view" id="episodes-view"></main>

  </div>

  <div class="modal-overlay" id="quality-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modal-episode-title">انتخاب کیفیت دانلود</span>
        <button class="close-modal" onclick="closeModal()">✕</button>
      </div>
      <div id="modal-qualities-list" style="display: flex; flex-direction: column; gap: 10px;">
        <!-- لیست کیفیت‌ها به صورت داینامیک پر می‌شود -->
      </div>
    </div>
  </div>

  <script>
    let allSeriesData = {};

    const seriesView = document.getElementById('series-view');
    const episodesView = document.getElementById('episodes-view');
    const backBtn = document.getElementById('back-btn');
    const pageTitle = document.getElementById('page-title');
    const qualityModal = document.getElementById('quality-modal');
    const modalEpisodeTitle = document.getElementById('modal-episode-title');
    const modalQualitiesList = document.getElementById('modal-qualities-list');

    // دریافت اطلاعات از API ورسل
    async function fetchSeries() {
      try {
        const response = await fetch('/api/serials');
        allSeriesData = await response.json();
        renderSeriesList();
      } catch (error) {
        seriesView.innerHTML = `<div class="loading-text" style="color:var(--crimson-red);">خطا در دریافت اطلاعات از سرور</div>`;
        console.error(error);
      }
    }

    function renderSeriesList() {
      if (!allSeriesData || Object.keys(allSeriesData).length === 0) {
        seriesView.innerHTML = `<div class="loading-text">سریالی یافت نشد.</div>`;
        return;
      }

      let html = '';
      for (const [serialId, serial] of Object.entries(allSeriesData)) {
        const epCount = serial.episodes ? Object.keys(serial.episodes).length : (serial.epCount || 0);
        const genresStr = serial.genres ? serial.genres.join('، ') : '';

        html += `
          <div class="series-card" onclick="openSeries('${serialId}')">
            <img class="series-img" src="${serial.image || 'https://via.placeholder.com/500x280/1e293b/94a3b8?text=Wolf+Series'}" alt="${serial.name}">
            <div class="series-info">
              <div class="series-title-row">
                <h2 class="series-title">${serial.name}</h2>
                <span class="badge-count">${epCount} قسمت</span>
              </div>
              <span class="series-meta">ژانر: ${genresStr}</span>
            </div>
          </div>
        `;
      }
      seriesView.innerHTML = html;
    }

    function openSeries(serialId) {
      const serial = allSeriesData[serialId];
      if (!serial) return;

      seriesView.style.display = 'none';
      episodesView.style.display = 'flex';
      backBtn.style.display = 'flex';
      pageTitle.innerText = serial.name;

      let html = '';
      if (serial.episodes) {
        for (const [epId, episode] of Object.entries(serial.episodes)) {
          // تبدیل آبجکت سایزها به جیسون برای استفاده در دکمه دانلود
          const sizesEncoded = encodeURIComponent(JSON.stringify(episode.sizes || {}));
          const linkEncoded = encodeURIComponent(episode.link || '#');

          html += `
            <div class="episode-card">
              <div class="episode-top">
                <img class="episode-img" src="${episode.image || serial.image || 'https://via.placeholder.com/120x80/1f2937/9ca3af?text=Ep'}" alt="قسمت ${episode.number}">
                <div class="episode-details">
                  <span class="episode-number">قسمت ${episode.number}</span>
                  <h3 class="episode-name">${episode.name}</h3>
                </div>
              </div>
              <div class="episode-actions">
                <button class="btn btn-download" onclick='openDownloadModal("${episode.name}", "${sizesEncoded}")'>
                  📥 دانلود کیفیت‌ها
                </button>
                <a href="${episode.link || '#'}" target="_blank" class="btn btn-play">
                  ▶ تماشای آنلاین
                </a>
              </div>
            </div>
          `;
        }
      } else {
        html = `<div class="loading-text">قسمتی برای این سریال ثبت نشده است.</div>`;
      }
      episodesView.innerHTML = html;
    }

    function showSeriesList() {
      episodesView.style.display = 'none';
      seriesView.style.display = 'flex';
      backBtn.style.display = 'none';
      pageTitle.innerText = 'آرشیو سریال‌ها';
    }

    function openDownloadModal(episodeName, sizesJsonStr) {
      modalEpisodeTitle.innerText = `دانلود ${episodeName}`;
      
      let sizes = {};
      try {
        sizes = JSON.parse(decodeURIComponent(sizesJsonStr));
      } catch(e) {}

      let qHtml = '';
      const qualityLabels = {
        "480": { title: "کیفیت 480p SD", format: "فرمت: MP4" },
        "720": { title: "کیفیت 720p HD", format: "فرمت: MP4" },
        "1080": { title: "کیفیت 1080p Full HD", format: "فرمت: MKV" }
      };

      for (const [resKey, sizeVal] of Object.entries(sizes)) {
        const info = qualityLabels[resKey] || { title: `کیفیت ${resKey}p`, format: "فرمت: ویدیو" };
        qHtml += `
          <a href="#" class="quality-option" onclick="alert('لینک دانلود کیفیت ${resKey}p آماده است')">
            <div class="quality-info">
              <span class="q-title">${info.title}</span>
              <span class="q-size">${info.format}</span>
            </div>
            <span style="font-size: 0.85rem; font-weight:700; color:var(--crimson-red);">${sizeVal}</span>
          </a>
        `;
      }

      if (qHtml === '') {
        qHtml = `<div class="loading-text">کیفیتی برای دانلود ثبت نشده است.</div>`;
      }

      modalQualitiesList.innerHTML = qHtml;
      qualityModal.classList.add('active');
    }

    function closeModal() {
      qualityModal.classList.remove('active');
    }

    qualityModal.addEventListener('click', (e) => {
      if (e.target === qualityModal) closeModal();
    });

    // شروع کار و لود اطلاعات از سرور
    fetchSeries();
  </script>

</body>
</html>
