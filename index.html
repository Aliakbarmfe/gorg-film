<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- تگ تأیید گوگل سرچ کنسول -->
  <meta name="google-site-verification" content="33T2Yd543fsmgIfJWMJb6P1nrmg8Fi-BP1nO9mCNarE" />
  
  <!-- سئو و عنوان سایت برای سرچ گوگل -->
  <title>سریال سرخ و سیاه قسمت جدید - دانلود و پخش آنلاین</title>
  <meta name="description" content="دانلود سریال سرخ و سیاه قسمت جدید با لینک مستقیم، کیفیت عالی و پخش آنلاین کامل. تماشای تمامی قسمت‌های سریال سرخ و سیاه از پلتفرم اختصاصی فیلم و سریال.">
  <meta name="keywords" content="سریال سرخ و سیاه قسمت جدید, دانلود سریال سرخ و سیاه, پخش آنلاین سریال سرخ و سیاه, تماشای سریال سرخ و سیاه">
  
  <!-- فونت فارسی وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --bg-dark: #050608;
      --bg-surface: #0c0e12;
      --card-bg: rgba(15, 18, 25, 0.7);
      --card-hover: rgba(22, 27, 38, 0.85);
      --crimson-red: #ff1e43;
      --crimson-glow: rgba(255, 30, 67, 0.4);
      --crimson-soft: rgba(255, 30, 67, 0.12);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-border-glow: rgba(255, 30, 67, 0.35);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-silver: #e2e8f0;
      --radius-xl: 24px;
      --radius-lg: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 15px 12px 40px 12px;
      overflow-x: hidden;
      position: relative;
    }

    /* ---------------- Background Atmosphere FX ---------------- */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      animation: pulseGlow 8s infinite alternate ease-in-out;
    }
    .glow-1 {
      width: 320px;
      height: 320px;
      top: -100px;
      right: -50px;
      background: var(--crimson-red);
    }
    .glow-2 {
      width: 250px;
      height: 250px;
      bottom: 10%;
      left: -80px;
      background: rgba(180, 10, 40, 0.5);
      animation-delay: -4s;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
      100% { transform: scale(1.2) translate(15px, 20px); opacity: 0.75; }
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    /* ---------------- Header & Cinema Logo ---------------- */
    .header {
      text-align: center;
      padding: 15px 0 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .cinema-brand {
      position: relative;
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(255, 30, 67, 0.15), rgba(0, 0, 0, 0.6));
      border: 1.5px solid var(--glass-border-glow);
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(255, 30, 67, 0.25), inset 0 0 15px rgba(255, 30, 67, 0.15);
      backdrop-filter: blur(10px);
      animation: floatLogo 4s ease-in-out infinite;
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }

    .cinema-svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
      filter: drop-shadow(0 2px 8px rgba(255,30,67,0.8));
    }

    .title {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-silver) 60%, var(--crimson-red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subtitle::before, .subtitle::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--crimson-red));
    }
    .subtitle::after {
      background: linear-gradient(-90deg, transparent, var(--crimson-red));
    }

    /* ---------------- Series Cards Container ---------------- */
    .series-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .series-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .series-card:active {
      transform: scale(0.97);
    }

    @media(hover: hover) {
      .series-card:hover {
        transform: translateY(-6px) scale(1.01);
        border-color: var(--glass-border-glow);
        box-shadow: 0 18px 40px rgba(255, 30, 67, 0.25);
      }
    }

    .series-img-wrapper {
      position: relative;
      width: 100%;
      height: 230px;
      overflow: hidden;
    }

    .series-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background-color: #161b22;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .series-card:hover .series-img {
      transform: scale(1.08);
    }

    .series-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg-surface) 5%, transparent 60%);
    }

    .badge-count {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(12, 14, 18, 0.75);
      color: #fff;
      border: 1px solid var(--glass-border-glow);
      backdrop-filter: blur(10px);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    @keyframes heartBeat {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      50% {
        transform: scale(1.5);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .badge-count::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: heartBeat 1.2s infinite ease-in-out;
    }

    .series-info {
      padding: 14px 18px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg-surface);
      margin-top: -10px;
      position: relative;
      z-index: 2;
    }

    /* ---------------- Direct Link Box ---------------- */
    .direct-series-box {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      box-shadow: 0 12px 35px rgba(0,0,0,0.6);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeInCard 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .direct-series-box:active {
      transform: scale(0.97);
    }

    @media(hover: hover) {
      .direct-series-box:hover {
        transform: translateY(-6px) scale(1.01);
        border-color: var(--glass-border-glow);
        box-shadow: 0 18px 40px rgba(255, 30, 67, 0.25);
      }
      .direct-series-box:hover .series-img {
        transform: scale(1.08);
      }
    }

    .direct-series-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .direct-series-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .direct-series-badge {
      background: linear-gradient(135deg, #ff1e43, #c80d2e);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 14px var(--crimson-glow);
    }

    .series-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
    }

    .series-meta {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loading-text {
      text-align: center;
      color: var(--text-sub);
      padding: 30px 20px;
      font-size: 0.9rem;
    }

    /* ---------------- Site Footer ---------------- */
    .site-footer {
      text-align: center;
      margin-top: 30px;
      padding: 15px 0;
      font-size: 0.82rem;
      color: var(--text-sub);
      border-top: 1px solid var(--glass-border);
      letter-spacing: -0.2px;
    }
  </style>
</head>
<body>

  <!-- Ambient FX -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="container">

    <header class="header">
      <div class="cinema-brand">
        <!-- New Cinema & Series Icon -->
        <svg class="cinema-svg" viewBox="0 0 24 24">
          <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4h-2l2 4h-3l-2-4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zm-6 10l-4-2.5v5l4-2.5z"/>
        </svg>
      </div>
      <h1 class="title" id="page-title">سریال سرخ و سیاه و سریال یل</h1>
      <p class="subtitle">پخش آنلاین و دانلود بی‌وقفه کیفیت بالا</p>
    </header>

    <main class="series-grid" id="series-view">
      <!-- محتوا به صورت استاتیک بارگذاری می‌شود -->
    </main>

    <!-- فوتر سایت با متن درخواستی -->
    <footer class="site-footer">
      اختصاصی، جمعه ها ساعت 8 صبح
    </footer>

  </div>

  <script>
    const directSeriesLinks = [];

    const seriesListData = {
      "sorkh-o-siah": {
        name: "سریال سرخ و سریاه فصل اول",
        image: "photos/safheaslii.jpg",
        genres: ["درام", "عاشقانه", "تاریخی"],
        pageUrl: "sorkh.html",
        defaultEpCount: 6
      },
      "yal-season-1": {
        name: "سریال یل فصل یک 🎬",
        image: "photos/yalfilm.jpg",
        genres: ["معمایی", "هیجان‌انگیز", "درام"],
        pageUrl: "yal.html",
        defaultEpCount: 7
      }
    };

    const seriesView = document.getElementById('series-view');

    function renderSeriesList() {
      const hasSeries = seriesListData && Object.keys(seriesListData).length > 0;
      const hasDirect = directSeriesLinks && directSeriesLinks.length > 0;

      if (!hasSeries && !hasDirect) {
        seriesView.innerHTML = `<div class="loading-text">سریالی یافت نشد.</div>`;
        return;
      }

      let html = '';
      let index = 0;

      for (const [serialId, serial] of Object.entries(seriesListData)) {
        const genresStr = serial.genres ? serial.genres.join(' • ') : '';
        const delay = index * 0.08;

        html += `
          <a href="${serial.pageUrl}" class="series-card" style="animation-delay: ${delay}s">
            <div class="series-img-wrapper">
              <img class="series-img" src="${serial.image}" alt="${serial.name}" loading="lazy">
              <div class="series-img-overlay"></div>
              <span class="badge-count" id="badge-${serialId}">${serial.defaultEpCount} قسمت</span>
            </div>
            <div class="series-info">
              <h2 class="series-title">${serial.name}</h2>
              <span class="series-meta">${genresStr}</span>
            </div>
          </a>
        `;
        index++;
      }

      directSeriesLinks.forEach((item) => {
        const genresStr = item.genres ? item.genres.join(' • ') : '';
        const delay = index * 0.08;

        html += `
          <a href="${item.link}" target="_blank" class="direct-series-box" style="animation-delay: ${delay}s">
            <div class="series-img-wrapper">
              <img class="series-img" src="${item.image}" alt="${item.title}" loading="lazy">
              <div class="series-img-overlay"></div>
            </div>
            <div class="series-info direct-series-content">
              <div class="direct-series-header">
                <h2 class="series-title">${item.title}</h2>
                <span class="direct-series-badge">دانلود و تماشا</span>
              </div>
              <span class="series-meta">${genresStr}</span>
            </div>
          </a>
        `;
        index++;
      });

      seriesView.innerHTML = html;
    }

    async function syncEpisodeCountFromPage(serialId, pageUrl) {
      try {
        const response = await fetch(pageUrl + '?v=' + Date.now());
        if (!response.ok) return;
        const htmlText = await response.text();
        const epBlockMatch = htmlText.match(/episodes\s*:\s*\{([\s\S]*?)\n\s*\}\s*\n\s*\}/);
        if (epBlockMatch && epBlockMatch[1]) {
          const epKeys = [...epBlockMatch[1].matchAll(/^\s*"(\d+)"\s*:/gm)];
          if (epKeys.length > 0) {
            const badgeEl = document.getElementById('badge-' + serialId);
            if (badgeEl) {
              badgeEl.innerText = `${epKeys.length} قسمت`;
            }
          }
        }
      } catch (e) {}
    }

    renderSeriesList();
    syncEpisodeCountFromPage('sorkh-o-siah', 'sorkh.html');
    syncEpisodeCountFromPage('yal-season-1', 'yal.html');
  </script>
  <script data-cfasync="false" src="https://bancadeltempoidea.org/14/fa246b2dbc11f66aade7de0c24c68b53"></script>
</body>
</html>
